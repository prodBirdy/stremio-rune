[package]
name = "stremio-rune"
version = "0.1.0"
edition = "2024"

[dependencies]
# Rune pins `dev` revs; bump the rev to update.
rune = { git = "https://github.com/anomalyco/rune", rev = "93c7a04b8d3e82efab3ada142989a0207957654d" }
ureq = { version = "3", features = ["json"] }
# preserve_order + float_roundtrip: addons written back to the account keep their key order and numbers.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
libloading = "0.8"
# Posters: metahub serves WebP, which Rune's ImageCache doesn't decode on desktop.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The app window's NSWindow, for native fullscreen (window.rs). The objc2 Rune's video import uses.
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
# mpv's GPU frames into Rune (video.rs): D3D11, OpenGL/WGL interop. The version wgpu's DX12 backend uses.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
# The child window mpv draws into, under the app's control bar.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_LibraryLoader"] }

# Image decoding runs on every card; unoptimized it takes ~10× longer (a 1920 px JPEG ~0.5 s).
[profile.dev.package]
image = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
image-webp = { opt-level = 3 }
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }

[build-dependencies]
# The app icon in the exe (build.rs).
embed-resource = "3"

# Rune with NativeSurface's Windows import (shared D3D textures), until it lands upstream.
[patch."https://github.com/anomalyco/rune"]
rune = { git = "https://github.com/prodBirdy/rune", branch = "stremio-win-import" }

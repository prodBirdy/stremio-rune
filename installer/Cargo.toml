[package]
name = "stremio-rune-setup"
version = "0.1.0"
edition = "2021"
description = "stremio-rune Setup: installs and uninstalls the app for the current user"
publish = false

# Its own build, not part of the app's.
[workspace]

[[bin]]
name = "stremio-rune-setup"
path = "src/main.rs"

[dependencies]
png = "0.17"
windows-numerics = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
